# egress-allowlist.conf — Squid ACL for clauded --lockdown mode
#
# This file is mounted read-only into the claude-egress-proxy container.
# It defines the ONLY domains sandbox containers may reach.
# Add entries here when legitimate tools need new hosts; keep it narrow.
#
# NOTE: Claude's web search and web fetch run server-side at Anthropic —
# they are NOT made from inside the container. Blocking arbitrary domains
# here does NOT affect Claude's ability to browse the web.

# ── Anthropic API (required for Claude to function) ───────────────────────────
acl allowed_dst dstdomain .anthropic.com

# ── GitHub (git push/pull, gh CLI) ────────────────────────────────────────────
acl allowed_dst dstdomain github.com
acl allowed_dst dstdomain api.github.com
acl allowed_dst dstdomain codeload.github.com
acl allowed_dst dstdomain objects.githubusercontent.com
acl allowed_dst dstdomain raw.githubusercontent.com

# ── npm ───────────────────────────────────────────────────────────────────────
acl allowed_dst dstdomain registry.npmjs.org

# ── Maven / Gradle (Java builds) ──────────────────────────────────────────────
acl allowed_dst dstdomain repo1.maven.org
acl allowed_dst dstdomain repo.maven.apache.org
acl allowed_dst dstdomain .gradle.org
acl allowed_dst dstdomain plugins.gradle.org
acl allowed_dst dstdomain services.gradle.org

# ── Adoptium (Temurin JDK) ────────────────────────────────────────────────────
acl allowed_dst dstdomain packages.adoptium.net

# ── PyPI ──────────────────────────────────────────────────────────────────────
acl allowed_dst dstdomain pypi.org
acl allowed_dst dstdomain files.pythonhosted.org

# ── Policy: CONNECT (HTTPS tunnels) only to the allowlist; deny everything else
http_access allow CONNECT allowed_dst
http_access deny CONNECT
http_access deny all
